name: Daily Heartbeat

on:
  schedule:
    # 每日北京时间 09:00 = UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write             # 心跳也可能 mark_pushed,需 commit state

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run heartbeat
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: Asia/Shanghai
        run: python src/main.py --heartbeat

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json 2>/dev/null || exit 0
          git diff --staged --quiet || git commit -m "state: heartbeat $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push
